<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖZLEM GÜMÜŞ | Ödeme Bilgileri</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#10131b;color:#fff;font-family:Arial,sans-serif;
  padding:22px
}
.card{
  width:100%;max-width:390px;background:#1b202b;
  border:1px solid #343b49;border-radius:24px;
  padding:30px 24px;text-align:center;
  box-shadow:0 20px 60px #0005
}
.logo{font-size:36px;color:#d8b66a}
h1{font-size:26px;margin:14px 0 8px}
.sub{color:#aeb6c5;font-size:14px}
hr{border:0;border-top:1px solid #343b49;margin:25px 0}
.label{color:#aeb6c5;font-size:13px;text-align:left}
.owner{font-size:20px;font-weight:bold;margin:9px 0 24px}
.iban{
  background:#11151e;padding:15px;border-radius:12px;
  overflow-wrap:anywhere;line-height:1.7;font-size:15px;
  margin:10px 0 16px
}
button{
  border:0;border-radius:12px;background:#d8b66a;
  color:#151515;font-size:16px;font-weight:bold;
  padding:16px;width:100%;cursor:pointer
}
.note{font-size:12px;line-height:1.6;color:#aeb6c5;margin-top:20px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">◆</div>
  <h1>ÖZLEM GÜMÜŞ</h1>
  <div class="sub">Banka Hesap Bilgileri</div>
  <hr>
  <div class="label">HESAP SAHİBİ</div>
  <div class="owner">Sami Uzlu</div>
  <div class="label">IBAN NUMARASI</div>
  <div class="iban" id="iban">TR920020500000601500700001</div>
  <button onclick="navigator.clipboard.writeText(document.getElementById('iban').innerText).then(()=>this.innerText='Kopyalandı ✓').catch(()=>alert('IBAN: '+document.getElementById('iban').innerText))">
    IBAN'I KOPYALA
  </button>
  <div class="note">
    Havale yapmadan önce hesap sahibi ve IBAN bilgilerini kontrol edin.
  </div>
</main>
</body>
</html>
